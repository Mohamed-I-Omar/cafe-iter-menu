<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منيو Café Iter">
<title>Café Iter</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style id="app-style">
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  img{max-width:100%;display:block}
  [hidden]{display:none!important}
  button{font-family:inherit}

  :root{
    --bg:#FBF7F1;
    --surface:#FFFFFF;
    --surface-2:#F4ECE1;
    --ink:#241C16;
    --muted:#8B7B6B;
    --line:#EADFD1;
    --accent:#C0781E;
    --accent-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(40,28,18,.06),0 8px 24px rgba(40,28,18,.05);
    --radius:16px;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme:dark){
      --bg:#151011;
      --surface:#211A18;
      --surface-2:#2B221D;
      --ink:#F3EADF;
      --muted:#A99684;
      --line:#352A24;
      --accent-ink:#1A1310;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#151011;
    --surface:#211A18;
    --surface-2:#2B221D;
    --ink:#F3EADF;
    --muted:#A99684;
    --line:#352A24;
    --accent-ink:#1A1310;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  body{
    direction:rtl;
    background:var(--bg);
    color:var(--ink);
    font-family:"Tajawal",system-ui,"Segoe UI",Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color:transparent;
    line-height:1.5;
  }
  .wrap{max-width:680px;margin:0 auto;padding-inline:16px}

  /* Header */
  .hero{padding-block:34px 18px;text-align:center}
  .brandmark{
    width:64px;height:64px;margin:0 auto 14px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--accent-ink);
    font-family:"El Messiri",serif;font-weight:700;font-size:30px;
    box-shadow:var(--shadow);overflow:hidden;
  }
  .brandmark img{width:100%;height:100%;object-fit:cover}

  /* Animated wordmark logo */
  .logo-anim{position:relative;display:inline-block;width:min(264px,74vw);margin:0 auto;
    animation:logoIn .9s cubic-bezier(.2,.7,.2,1) both, logoFloat 6s ease-in-out 1.1s infinite;}
  .logo-img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
  .logo-shine{position:absolute;inset:0;pointer-events:none;z-index:3;
    -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
    background-image:linear-gradient(105deg,transparent 43%,rgba(255,246,220,.92) 50%,transparent 57%);
    background-repeat:no-repeat;background-size:250% 100%;background-position:160% 0;
    mix-blend-mode:screen;animation:logoShine 5s ease-in-out 1.6s infinite;}
  .steam{position:absolute;top:-7%;left:13%;width:42px;height:42px;pointer-events:none;z-index:2}
  .steam i{position:absolute;bottom:0;width:5px;height:15px;border-radius:6px;
    background:linear-gradient(to top,rgba(240,226,185,0),rgba(243,231,198,.6));filter:blur(2px);opacity:0;transform-origin:bottom center}
  .steam i:nth-child(1){left:2px;animation:steam 3.2s ease-out .3s infinite}
  .steam i:nth-child(2){left:13px;animation:steam 3.7s ease-out 1.1s infinite}
  .steam i:nth-child(3){left:24px;animation:steam 3s ease-out 2s infinite}
  @keyframes logoIn{0%{opacity:0;transform:translateY(14px) scale(.95)}100%{opacity:1;transform:none}}
  @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes logoShine{0%{background-position:160% 0}55%,100%{background-position:-70% 0}}
  @keyframes steam{0%{opacity:0;transform:translateY(0) scaleX(1)}25%{opacity:.65}60%{opacity:.4}100%{opacity:0;transform:translateY(-28px) translateX(5px) scaleX(1.6)}}
  .cafe-name{
    font-family:"El Messiri",serif;font-weight:700;
    font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;
    letter-spacing:.3px;text-wrap:balance;cursor:default;user-select:none;
  }
  .cafe-tag{color:var(--muted);font-size:15px;margin:8px 0 0;text-wrap:balance}
  .hairline{
    width:56px;height:3px;border-radius:3px;background:var(--accent);
    margin:16px auto 0;opacity:.9;
  }

  /* Category nav */
  .nav{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:saturate(1.2) blur(10px);
    -webkit-backdrop-filter:saturate(1.2) blur(10px);
    border-block:1px solid var(--line);margin-top:14px;
  }
  .nav-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:680px;margin:0 auto}
  .nav-inner::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);border-radius:16px;padding:7px 15px;cursor:pointer;
    white-space:nowrap;transition:.15s;font-family:"Tajawal",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;
    text-decoration:none;color:var(--ink);-webkit-tap-highlight-color:transparent;
  }
  .chip .chip-en{font-weight:700;font-size:13.5px}
  .chip .chip-ar{font-size:12px;opacity:.75;font-weight:500}
  .chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip.active .chip-ar{opacity:.9}

  /* Sections */
  main{padding-bottom:64px}
  .section{padding-top:30px;scroll-margin-top:92px}
  .section-title{
    font-family:"El Messiri",serif;font-weight:600;font-size:22px;margin:0;
  }
  .section-title .em{color:var(--accent)}
  .section-ar{font-family:"Tajawal",system-ui,sans-serif;font-weight:700;font-size:15px;color:var(--accent);margin:2px 0 0}
  .section-desc{color:var(--muted);font-size:13.5px;margin:4px 0 8px}

  .item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
  .section .item:first-of-type{border-top:none}
  .item.out{opacity:.5}
  .item-thumb{
    flex:0 0 auto;width:56px;height:56px;border-radius:12px;object-fit:cover;
    background:var(--surface-2);
  }
  .item-body{flex:1 1 auto;min-width:0}
  .item-top{display:flex;align-items:baseline;gap:10px}
  .item-name{font-weight:700;font-size:16px;margin:0;flex:1 1 auto}
  .leader{flex:1 1 auto;border-bottom:1.5px dotted var(--line);transform:translateY(-4px);min-width:12px}
  .item-price{
    flex:0 0 auto;font-weight:700;font-size:15px;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .item-desc{color:var(--muted);font-size:13.5px;margin:3px 0 0}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--surface-2);color:var(--muted);margin-inline-start:8px;vertical-align:middle;
  }
  .badge.hot{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

  .empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:15px}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 0 8px}

  /* Admin launcher + panel */
  .gear{
    position:fixed;inset-block-end:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;
    z-index:40;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
    background:var(--ink);color:var(--bg);font-size:20px;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;
  }
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(20,14,12,.5);display:flex;align-items:stretch;justify-content:flex-start}
  .panel{
    background:var(--bg);width:min(520px,100%);height:100%;overflow-y:auto;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .panel-head{
    position:sticky;top:0;background:var(--bg);z-index:2;
    display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  }
  .panel-head h2{font-family:"El Messiri",serif;font-size:19px;margin:0;flex:1}
  .tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
  .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tabpane{padding:16px}

  .adm-cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:14px;box-shadow:var(--shadow)}
  .adm-cat-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .adm-cat-head .grip{color:var(--muted);font-size:13px}
  .adm-prod{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--bg)}
  .adm-prod .pn{flex:1;font-weight:600;font-size:14px}
  .adm-prod .pp{color:var(--accent);font-weight:700;font-size:13px}
  .adm-prod.out .pn{text-decoration:line-through;opacity:.6}

  label.fld{display:block;margin-bottom:12px}
  label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
  input[type=text],input[type=number],textarea,select{
    width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;
  }
  textarea{min-height:64px;resize:vertical}
  input:focus,textarea:focus,select:focus,button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .btn{border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface-2);color:var(--ink)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.icon{background:var(--surface-2);width:34px;height:34px;padding:0;border-radius:9px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
  .btn.danger{color:#c0392b}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spacer{flex:1}

  .savebar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
  .savebar .msg{font-size:13px;color:var(--muted);flex:1}
  .savebar .msg.ok{color:var(--accent)}
  .savebar .msg.err{color:#c0392b}

  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer}
  .sw.sel{border-color:var(--ink)}

  .qrbox{background:#fff;border-radius:var(--radius);padding:22px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
  .qrbox canvas,.qrbox img{margin:0 auto;image-rendering:pixelated}
  .qrurl{word-break:break-all;font-size:12.5px;color:var(--muted);margin-top:12px;font-family:ui-monospace,monospace;direction:ltr}
  .hint{font-size:13px;color:var(--muted);line-height:1.7;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-top:14px}
  .modal-back{position:fixed;inset:0;z-index:60;background:rgba(20,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--bg);border-radius:var(--radius);width:min(440px,100%);max-height:90vh;overflow-y:auto;padding:18px;box-shadow:var(--shadow)}
  .modal h3{font-family:"El Messiri",serif;margin:0 0 14px;font-size:18px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}.logo-anim,.logo-shine,.steam i{animation:none!important}.logo-anim{opacity:1;transform:none}}
</style>
</head>

<script id="app-script">
(function(){
  "use strict";

  // ---------- helpers ----------
  var $ = function(s,r){return (r||document).querySelector(s);};
  function el(tag, attrs, kids){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){
      if(k==="class") e.className=attrs[k];
      else if(k==="text") e.textContent=attrs[k];
      else if(k==="html") e.innerHTML=attrs[k];
      else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2),attrs[k]);
      else if(attrs[k]!=null) e.setAttribute(k,attrs[k]);
    }
    if(kids) (Array.isArray(kids)?kids:[kids]).forEach(function(c){ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
    return e;
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
  function uid(p){return (p||"x")+Math.random().toString(36).slice(2,8);}
  function clone(o){return JSON.parse(JSON.stringify(o));}

  // ---------- Supabase config (cloud storage) ----------
  // يتم ملؤها بعد إنشاء مشروع Supabase — المفتاح العام (anon) آمن للنشر.
  var SUPABASE_URL  = "";   // مثال: https://xxxx.supabase.co
  var SUPABASE_ANON = "";   // anon public key
  var MENU_ID = "iter";
  var hasCloud = function(){ return !!(SUPABASE_URL && SUPABASE_ANON); };
  var adminPwd = "";
  try{ adminPwd = sessionStorage.getItem("iter_pwd") || ""; }catch(e){}

  // ---------- state ----------
  var state;
  try{ state = JSON.parse(document.getElementById("state").textContent); }
  catch(e){ state = {name:"المنيو",categories:[]}; }
  if(!state.categories) state.categories=[];

  function cloudHeaders(){ return {apikey:SUPABASE_ANON, Authorization:"Bearer "+SUPABASE_ANON}; }

      headers:Object.assign({"Content-Type":"application/json"}, cloudHeaders()),
      body:JSON.stringify({pwd:pwd, new_data:data})
    }).then(function(r){
      if(r.ok) return true;
      return r.text().then(function(t){ var e=new Error(t||"err"); e.status=r.status; throw e; });

  function formatPrice(p){

  function setActiveChip(id){
    document.querySelectorAll(".chip").forEach(function(ch){ ch.classList.toggle("active", ch.getAttribute("data-target")===id); });
  }
  function goToSection(id, e){
    var t=document.getElementById("sec-"+id); if(!t) return;
    setActiveChip(id);
    var nav=document.querySelector(".nav");
    var navH=nav?nav.getBoundingClientRect().height:0;
    var se=document.scrollingElement||document.documentElement||document.body;
    var before=(se&&se.scrollTop)||window.scrollY||0;
    var y=t.getBoundingClientRect().top + before - navH - 8; if(y<0) y=0;
    var moved=false;
    try{ se.scrollTop=y; if(Math.abs(((se&&se.scrollTop)||0)-before)>2) moved=true; }catch(_){}
    if(!moved){ try{ window.scrollTo(0,y); if(Math.abs((window.scrollY||0)-before)>2) moved=true; }catch(_){} }
    if(!moved){ try{ document.body.scrollTop=y; if(Math.abs((document.body.scrollTop||0)-before)>2) moved=true; }catch(_){} }
    if(!moved){ try{ t.scrollIntoView(true); moved=true; }catch(_){} }
    if(moved && e){ e.preventDefault(); } // JS scroll worked; else let the native #anchor handle it
  }

  var spyCleanup=null;
  function setupScrollSpy(cats){
    if(spyCleanup) spyCleanup();
    function onScroll(){
      var chips=document.querySelectorAll(".chip");
      var best=null,bestTop=1e9;
      cats.forEach(function(c){
        var s=document.getElementById("sec-"+c.id); if(!s) return;
        var t=s.getBoundingClientRect().top;
        if(t<=120 && t>-9999 && (120-t)<bestTop){ /* nearest above threshold */ }
      });
      // choose the last section whose top is above 130px
      var current=cats[0]?cats[0].id:null;
      cats.forEach(function(c){ var s=document.getElementById("sec-"+c.id); if(s && s.getBoundingClientRect().top<=130) current=c.id; });
      chips.forEach(function(ch){ ch.classList.toggle("active", ch.getAttribute("data-target")===current); });
      var act=document.querySelector('.chip[data-target="'+current+'"]');
      if(act && act.scrollIntoView) act.scrollIntoView({inline:"nearest",block:"nearest"});
    }
    window.addEventListener("scroll",onScroll,{passive:true});
    spyCleanup=function(){window.removeEventListener("scroll",onScroll);};
  }

    if(currentQrUrl()) loadQr(currentQrUrl());

  function loadQr(url){
    var slot=document.getElementById("qrslot"); if(!slot) return;
    function draw(){
      slot.textContent="";
      try{
        var q=new QRious({value:url,size:520,level:"H",background:"#ffffff",foreground:"#1a120c"});
        var img=new Image(); img.src=q.toDataURL("image/png"); img.width=260; img.height=260; img.alt="QR Code"; img.style.width="260px"; img.style.height="260px";
        img.id="qrimg";
        slot.appendChild(img);
      }catch(e){ slot.textContent="تعذّر إنشاء الكود — انسخ الرابط بالأسفل."; }
    }
    if(window.QRious){ draw(); return; }
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js";
    s.onload=draw; s.onerror=function(){ slot.textContent="تعذّر تحميل مكتبة الكود — انسخ الرابط بالأسفل واستخدم أي موقع QR."; };
    document.head.appendChild(s);
  }
  function printQr(){
    var img=document.getElementById("qrimg");
    var url=currentQrUrl();
    if(!url){ alert("الصق رابط المشاركة العام الأول."); return; }
    var w=window.open("","_blank");
    if(!w){ alert("متصفحك منع فتح نافذة الطباعة — اعمل Screenshot للكود بدل الطباعة."); return; }
    w.document.write('<html><head><title>QR</title></head><body style="margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">'+
      '<img src="'+(img?img.src:"")+'" style="width:70vmin;height:70vmin;image-rendering:pixelated">'+
      '<div style="margin-top:16px;font-size:22px">'+esc(state.name||"")+'</div>'+
      '<div style="margin-top:6px;color:#666;font-size:12px;direction:ltr">'+esc(url)+'</div>'+
      '</body></html>');
    w.document.close(); setTimeout(function(){ w.focus(); w.print(); },300);
  }

  function serialize(){
    var fonts=document.getElementById("app-fonts").outerHTML;
    var style=document.getElementById("app-style").outerHTML;
    var script=document.getElementById("app-script").outerHTML;
    var stateTag='<script id="state" type="application/json">'+stateJSON()+'<\/script>';
    var themeAttr = state.theme==="light"?' data-theme="light"':(state.theme==="dark"?' data-theme="dark"':'');
    return '<!doctype html>\n<html lang="ar" dir="rtl"'+themeAttr+'>\n<head>\n'+
      '<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
      '<title>'+esc(state.name||"المنيو")+'<\/title>\n'+
      fonts+'\n'+style+'\n</head>\n<body>\n'+
      '<div id="app"><\/div>\n'+stateTag+'\n'+script+'\n</body>\n</html>';
  }

  function setMsg(txt,cls){ var m=document.getElementById("savemsg"); if(m){ m.textContent=txt; m.className="msg"+(cls?" "+cls:""); } }

  function doSave(){
    var btn=document.getElementById("savebtn");
    if(btn) btn.disabled=true;
    try{ document.getElementById("state").textContent=JSON.stringify(state); }catch(e){}
    render();

    // ----- Cloud (Supabase) path -----
    if(hasCloud()){
      if(!adminPwd){
        var p=prompt("اكتب كلمة سر الإدارة للحفظ:");
        if(p==null){ if(btn) btn.disabled=false; setMsg("اتلغى الحفظ."); return; }
        adminPwd=p; try{ sessionStorage.setItem("iter_pwd", adminPwd); }catch(e){}
      }
      setMsg("جاري الحفظ...");
      saveRemote(state, adminPwd).then(function(){
        dirty=false; setMsg("تم الحفظ ونشره للعملاء ✓","ok"); if(btn) btn.disabled=false;
      }).catch(function(err){
        if(btn) btn.disabled=false;
        if(err && (err.status===401 || err.status===403 || /unauthorized/i.test(err.message||""))){
          adminPwd=""; try{ sessionStorage.removeItem("iter_pwd"); }catch(e){}
          setMsg("كلمة السر غلط — حاول تاني.","err");
        } else {
          setMsg("تعذّر الحفظ، تأكد من الاتصال وحاول تاني.","err");
        }
      });
      return;
    }

    // ----- Claude artifact fallback -----
    setMsg("جاري النشر...");
    if(!(window.claude && window.claude.use)){
      if(btn) btn.disabled=false;
      setMsg("النشر متاح فقط على النسخة المنشورة، مش المعاينة المحلية.","err");
      return;
    }
    window.claude.use("artifact").then(function(artifact){
      if(!artifact){ if(btn) btn.disabled=false; setMsg("النشر غير متاح في هذه الجلسة.","err"); return; }
      var html;
      try{ html=serialize(); }catch(e){ if(btn) btn.disabled=false; setMsg("خطأ أثناء تجهيز الصفحة.","err"); return; }
      artifact.publish(html).then(function(){
        dirty=false; setMsg("تم النشر بنجاح ✓","ok"); if(btn) btn.disabled=false;
      }).catch(function(err){
        if(btn) btn.disabled=false;
        var code=err&&err.code;
        if(code==="not_writer"||code==="not_granted"||code==="consent_required"){
          setMsg("النسخة دي للعرض فقط — التعديل متاح لصاحب المنيو من الرابط الأصلي.","err");
        } else if(code==="conflict"){
          setMsg("اتنشرت نسخة أحدث للتو، الصفحة هتتحدث تلقائياً.","err");
        } else if(code==="rate_limited"){
          setMsg("تم النشر كتير بسرعة — استنى شوية وحاول تاني.","err");
        } else {
          setMsg("تعذّر النشر، حاول مرة أخرى.","err");
        }
      });
    });
  }

  // expose nothing globally except through DOM; boot
  render();
  // refresh from cloud (customers always see the latest saved menu)
  loadRemote().then(function(data){
    if(data){ state=data; if(!state.categories) state.categories=[]; render(); }
  });
})();
</script>
</body>
</html>
